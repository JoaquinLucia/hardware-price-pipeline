<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Historial - {{ producto.nombre }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Importamos la librería de gráficos Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

<div class="container mt-5">
    <div class="row mb-4">
        <div class="col">
            <a href="/" class="btn btn-outline-secondary mb-3">&larr; Volver al panel</a>
            <h3 class="fw-bold text-primary">{{ producto.nombre }}</h3>
            <span class="badge bg-secondary">{{ producto.tienda }}</span>
            <a href="{{ producto.url }}" target="_blank" class="btn btn-sm btn-link">Ver publicación original</a>
        </div>
    </div>

    <!-- Contenedor del Gráfico -->
    <div class="card shadow-sm mb-5">
        <div class="card-body">
            <h5 class="card-title text-muted mb-4">Evolución del Precio</h5>
            <!-- Acá se dibuja la curva -->
            <canvas id="graficoPrecios" height="100"></canvas>
        </div>
    </div>
</div>

<script>
    // 1. Recibimos las listas de Python y las convertimos a JavaScript nativo
const etiquetasFechas = JSON.parse('{{ fechas | tojson }}');
const datosPrecios = JSON.parse('{{ precios | tojson }}');

    // 2. Apuntamos al canvas de HTML
    const ctx = document.getElementById('graficoPrecios').getContext('2d');

    // 3. Configuramos y dibujamos el gráfico
    new Chart(ctx, {
        type: 'line',
        data: {
            labels: etiquetasFechas, // Las fechas van en el eje X
            datasets: [{
                label: 'Precio ($)',
                data: datosPrecios, // Los montos van en el eje Y
                borderColor: '#0d6efd', // Color azul de Bootstrap
                backgroundColor: 'rgba(13, 110, 253, 0.1)',
                borderWidth: 2,
                pointBackgroundColor: '#0d6efd',
                pointRadius: 4,
                fill: true, // Pinta suavemente debajo de la curva
                tension: 0.2 // Le da una ligera curva elegante a los picos
            }]
        },
        options: {
            responsive: true,
            scales: {
                y: {
                    beginAtZero: false // Para que el gráfico no se achate si los precios son altos
                }
            }
        }
    });
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
